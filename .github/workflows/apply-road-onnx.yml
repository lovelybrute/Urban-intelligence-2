name: Export Road AI to ONNX

on:
  workflow_dispatch:
  push:
    paths:
      - "frontend/ml/weights/road_defect_best.pt"
      - ".github/workflows/apply-road-onnx.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install export dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ultralytics==8.3.0" "onnx>=1.16,<2" "onnxruntime>=1.18,<2" "onnxscript>=0.1,<1" "onnxslim==0.1.34"

      - name: Export trained road model
        run: |
          python - <<'PY'
          from pathlib import Path
          from ultralytics import YOLO

          src = Path("frontend/ml/weights/road_defect_best.pt")
          if not src.is_file():
              raise SystemExit(f"Missing trained checkpoint: {src}")

          model = YOLO(str(src))
          exported = Path(model.export(format="onnx", imgsz=320, simplify=True, dynamic=False))
          target = src.with_suffix(".onnx")
          if exported.resolve() != target.resolve():
              target.write_bytes(exported.read_bytes())
          print(f"Exported {target} ({target.stat().st_size} bytes)")
          PY

      - name: Commit ONNX model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/ml/weights/road_defect_best.onnx
          if git diff --cached --quiet; then
            echo "ONNX model is already current."
          else
            git commit -m "ml: export road detector to ONNX"
            git push
          fi
