name: AI Pipeline Check

on:
  push:
    branches: [ai-integration-clean]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend/app
      - name: Import AI services
        working-directory: backend
        run: |
          python - <<'PY'
          from app.services import road_detector
          from app.services import vision_detector
          from app.services import video_analytics
          from app.services import anpr_detector
          from app.services import infrastructure_detector
          from app.api.routes import detection
          print("AI pipeline imports OK")
          PY
