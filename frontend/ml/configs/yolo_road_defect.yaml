# =============================================================================
# Road Defect Detection - Dataset Configuration (YOLOv8 Format)
# Benchmark Reference: Road Damage Dataset (RDD2022) + Urban Mobile Sensing
# =============================================================================

path: ../datasets/road_defects  # dataset root dir
train: images/train            # train images (relative to 'path')
val: images/val                # val images (relative to 'path')
test: images/test              # test images (optional)

# Classes
names:
  0: longitudinal_crack
  1: transverse_crack
  2: alligator_crack
  3: other_corruption
  4: pothole
